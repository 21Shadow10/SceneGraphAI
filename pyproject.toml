[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-analysis"
version = "1.0.0"
description = "Detect shots, scenes and face groups in a video and export them as JSON"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "av>=13,<19",
  "faster-whisper>=1.1,<2",
  "imageio-ffmpeg>=0.5,<1",
  "insightface==0.7.3",
  "langchain-core>=1,<2",
  "langchain-openai>=1,<2",
  "matplotlib>=3.9,<4",
  "numpy>=1.26,<3",
  "onnxruntime>=1.20,<2",
  "opencv-python-headless>=4.10,<6",
  "pandas>=2.2,<4",
  "pillow>=10,<14",
  "pydantic>=2.8,<3",
  "python-dotenv>=1,<2",
  "scenedetect>=0.6.4,<0.7",
  "scipy>=1.12,<2",
]

[project.optional-dependencies]
dev = ["ipykernel>=6,<8", "pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "I"]